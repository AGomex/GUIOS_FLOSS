services:
  db:
    image: postgres:16-alpine
    container_name: guiospro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guiospro}
      POSTGRES_USER: ${POSTGRES_USER:-guiospro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guiospro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - guiospro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guiospro} -d ${POSTGRES_DB:-guiospro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: guiospro-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

volumes:
  guiospro_pgdata:

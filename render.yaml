# Blueprint de Render: API (Django), Postgres y frontend (React).
# Se aplica con New > Blueprint en el dashboard de Render.

databases:
  - name: guiospro-db
    databaseName: guiospro
    user: guiospro
    plan: free
    region: oregon

services:
  - type: web
    name: guiospro-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py load_demo_snapshot &&
      python manage.py ensure_superuser
    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 120
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: guiospro-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: guiospro-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://guiospro-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://guiospro-api.onrender.com
      - key: LITERATURE_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MIN_INTERVAL
        value: "4.5"
      - key: LITERATURE_YEAR_FROM
        value: "2020"
      - key: LITERATURE_YEAR_TO
        value: "2026"
      - key: LOG_LEVEL
        value: INFO
      # Secretos: se completan en el dashboard de Render.
      - key: GEMINI_API_KEY
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: guiospro-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        value: https://guiospro-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
